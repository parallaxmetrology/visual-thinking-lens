name: demo
# Manual until the repository is public: Pages isn't available for private repos
# on the free plan. At launch, restore the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["docs/**"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
